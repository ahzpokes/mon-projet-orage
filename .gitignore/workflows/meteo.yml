name: Mise à jour météo orages

on:
  schedule:
    # Toutes les 3 heures (cron : minute heure jour mois jour-semaine)
    - cron: "17 */3 * * *"
  workflow_dispatch:   # Permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write      # Autorise le robot à modifier le dépôt

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupère ton code
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # 2. Installe Python
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Installe les librairies
      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # 4. Lance le script
      - name: Générer les prévisions
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: python generer_meteo.py

      # 5. Sauvegarde le JSON dans le dépôt
      - name: Commit et push du JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/previsions_orages.json
          git diff --staged --quiet || git commit -m "Mise à jour auto prévisions orages $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
name: Déploiement automatique React (GitHub Pages)

on:
  # Déclencheur 1 : Dès que le script météo a terminé avec succès
  workflow_run:
    workflows: ["Actualisation Prévisions Orages (ATFCM)"] # Doit correspondre EXACTEMENT au "name:" de ton autre fichier yml
    types:
      - completed
  
  # Déclencheur 2 : Si tu fais un push manuel sur la branche main
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    # On s'assure qu'on ne déploie que si le script précédent a bien marché
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Version standard et stable

      - name: 📦 Installation des dépendances (npm install)
        run: npm ci # "ci" est plus propre et rapide que "install" pour les bots

      - name: 🚀 Déploiement sur GitHub Pages (npm run deploy)
        run: |
          # Configure Git pour que le bot puisse créer le commit de déploiement
          git config --global user.name "Actions Bot Déploiement"
          git config --global user.email "actions@github.com"
          
          # Construit le projet
          npm run build
          
          # Force l'URL avec le token pour l'authentification
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Pousse le dossier dist sur gh-pages (paramètres spécifiques pour l'Action)
          npx gh-pages -d dist -u "Actions Bot Déploiement <actions@github.com>"
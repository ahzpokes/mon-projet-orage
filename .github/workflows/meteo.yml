name: Mise à jour météo orages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer les prévisions
        env:
          METEOFRANCE_TOKEN: ${{ secrets.METEOFRANCE_TOKEN }}
          METEOFRANCE_TOKEN_PI: ${{ secrets.METEOFRANCE_TOKEN_PI }}
        run: python generer_meteo.py

      - name: Commit et push du JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/previsions_orages.json
          git diff --staged --quiet || git commit -m "Mise à jour météo orages $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
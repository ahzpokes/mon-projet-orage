# ============================================================
# Workflow : génération des prévisions CB ICON-EU + déploiement
#
# - Toutes les 3h, ~20 min après la publication typique des runs
#   ICON-EU (les fichiers GRIB arrivent 2-3h après l'heure du cycle)
# - Déclenchement manuel possible (bouton "Run workflow")
#
# IMPORTANT : le cron ne s'exécute QUE sur la branche par défaut (main).
# Sur une branche de test, utiliser le déclenchement manuel.
# ============================================================

name: Meteo ICON-EU

on:
  schedule:
    # 3h20, 6h20, 9h20, 12h20, 15h20, 18h20, 21h20, 0h20 UTC
    # (GitHub peut retarder le cron de 15-30 min sous charge : marge incluse)
    - cron: "20 3,6,9,12,15,18,21,0 * * *"
  workflow_dispatch:

# Évite que deux exécutions se chevauchent (le JSON serait corrompu)
concurrency:
  group: meteo-iconeu
  cancel-in-progress: false

permissions:
  contents: write    # commit du JSON dans le repo
  pages: write       # déploiement GitHub Pages
  id-token: write    # requis pour deploy-pages

jobs:
  generer-et-deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # --------------------------------------------------------
      # 1. Récupération du code
      # --------------------------------------------------------
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Environnement Python + dépendances
      #    cfgrib nécessite la lib eccodes : le package PyPI "eccodes"
      #    fournit les binaires précompilés (pas besoin d'apt).
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installation des dépendances Python
        run: pip install -r requirements.txt

      # --------------------------------------------------------
      # 3. Génération du JSON météo
      #    Le script trouve le dernier run ICON-EU disponible,
      #    télécharge CAPE/CIN/HTOP_CON jusqu'à H+24 et écrit
      #    public/previsions_orages.json (écriture atomique).
      # --------------------------------------------------------
      - name: Génération des prévisions orages
        run: python generer_meteo.py

      # --------------------------------------------------------
      # 4. Commit du JSON UNIQUEMENT s'il a changé
      #    (évite les commits vides si le run modèle est identique)
      # --------------------------------------------------------
      - name: Commit du JSON si modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/previsions_orages.json
          if git diff --cached --quiet; then
            echo ">> JSON inchangé, pas de commit."
          else
            RUN_MODELE=$(python -c "import json; print(json.load(open('public/previsions_orages.json'))['run_modele'])")
            git commit -m "chore: maj previsions orages ICON-EU (run ${RUN_MODELE})"
            git push
          fi

      # --------------------------------------------------------
      # 5. Build du frontend (Vite/React)
      #    public/previsions_orages.json est copié dans dist/
      #    automatiquement par Vite.
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installation des dépendances Node
        run: npm ci

      - name: Build du site
        run: npm run build

      # --------------------------------------------------------
      # 6. Déploiement GitHub Pages
      #    Prérequis : Settings > Pages > Source = "GitHub Actions"
      # --------------------------------------------------------
      - name: Upload de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
